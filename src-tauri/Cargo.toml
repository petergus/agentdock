[package]
name = "agentdock"
version = "0.1.0"
description = "Native macOS Agent Context Switchboard"
authors = ["Peter"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "agentdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml_edit = "0.22"
tiktoken-rs = "0.6"
thiserror = "2"
walkdir = "2"
dirs = "6"
notify = "7"

[dev-dependencies]
tempfile = "3"
